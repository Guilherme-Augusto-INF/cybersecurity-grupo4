<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Revisão de layout — Grupo 4</title><style>*{box-sizing:border-box}body{margin:0;background:#121923;color:#e8f1fa;font:13px system-ui}header{height:80px;padding:12px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid #345}strong{margin-right:15px}button,a{color:#e8f1fa;background:#1b2b3e;border:1px solid #456;padding:9px 12px;cursor:pointer;border-radius:4px;text-decoration:none;font:inherit}button[aria-pressed=true]{background:#55f5ff;color:#05131c;border-color:#55f5ff}button:focus-visible,a:focus-visible{outline:2px solid #55f5ff;outline-offset:3px}main{height:calc(100vh - 80px);position:relative;overflow:hidden}iframe{position:absolute;left:50%;top:50%;border:1px solid #6c7f95;background:#05070d;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center}output{font:11px monospace;color:#adbbcc;margin-left:auto}</style></head><body><header><strong>REVISÃO DE LAYOUT</strong><button data-w="1920" data-h="1080">1920 × 1080</button><button data-w="1366" data-h="768" aria-pressed="true">1366 × 768</button><button data-w="768" data-h="1024">768 × 1024</button><button data-w="390" data-h="844">390 × 844</button><button data-w="360" data-h="800">360 × 800</button><button data-w="320" data-h="667">320 × 667</button><a href="/" target="_blank">Abrir apresentação</a><output aria-live="polite">1366 × 768</output></header><main><iframe id="preview" title="Apresentação em viewport de teste" src="/" width="1366" height="768" allowfullscreen></iframe></main><script>const frame=document.querySelector('iframe');const buttons=document.querySelectorAll('[data-w]');const fit=()=>{const w=Number(frame.width),h=Number(frame.height);frame.style.setProperty('--scale',Math.min((innerWidth-32)/w,(innerHeight-100)/h));};buttons.forEach(button=>button.addEventListener('click',()=>{frame.width=button.dataset.w;frame.height=button.dataset.h;buttons.forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelector('output').textContent=frame.width+' × '+frame.height;fit();}));addEventListener('resize',fit);fit();</script></body></html>
